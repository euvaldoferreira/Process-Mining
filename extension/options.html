<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Opções - Process Mining</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; max-width: 480px; color: #1f2328; }
      .version { font-size: 12px; color: #6a737d; }
      .site-panel {
        background: #f6f8fa;
        border: 1px solid #e1e4e8;
        border-radius: 6px;
        padding: 10px;
        margin: 12px 0;
      }
      .site-url { font-size: 12px; word-break: break-all; margin-bottom: 6px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5da; flex-shrink: 0; }
      .dot.on { background: #2da44e; }
      .dot.off { background: #cf222e; }
      #toggleSite { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid #d0d7de; cursor: pointer; background: #fff; }
      #toggleSite.allow { background: #2da44e; color: #fff; border-color: #2da44e; }
      #toggleSite.remove { background: #fff; color: #cf222e; border-color: #cf222e; }
      label { display: block; margin-top: 8px; font-weight: 600; }
      input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; }
      button { margin-top: 12px; padding: 8px 16px; }
      .row { margin-top: 8px; }
      .row label { display: inline; font-weight: normal; }
    </style>
  </head>
  <body>
    <h1>Process Mining Collector <span class="version" id="version"></span></h1>
    <p>Configure a URL da API e os sites que podem ser observados.</p>
    <p>Esta extensão nunca captura senhas, tokens, CPF, CNPJ ou informações de login.</p>

    <div class="site-panel">
      <div class="site-url" id="currentSiteUrl">Carregando site atual…</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
      <button id="toggleSite" style="display: none"></button>
    </div>

    <label>URL da API</label>
    <input id="apiUrl" placeholder="https://seu-worker.cloudflare.com" />
    <label>Chave de API</label>
    <input id="apiKey" type="password" placeholder="Opcional, se configurada no worker" />
    <label>Sites permitidos (um por linha)</label>
    <textarea id="enabledSites" rows="6" placeholder="https://sei.example.com"></textarea>
    <div class="row">
      <label><input id="isEnabled" type="checkbox" checked /> Ativar observação</label>
    </div>
    <button id="save">Salvar</button>
    <script src="popup.js"></script>
  </body>
</html>

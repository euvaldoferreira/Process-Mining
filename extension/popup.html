<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Process Mining</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        width: 320px;
        color: #1f2328;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 14px;
        border-bottom: 1px solid #e1e4e8;
      }
      header h1 { font-size: 14px; margin: 0; }
      header .version { font-size: 11px; color: #6a737d; }
      main { padding: 12px 14px; }
      .site-panel {
        background: #f6f8fa;
        border: 1px solid #e1e4e8;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
      }
      .site-url { font-size: 12px; word-break: break-all; margin-bottom: 6px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5da; flex-shrink: 0; }
      .dot.on { background: #2da44e; }
      .dot.off { background: #cf222e; }
      #toggleSite {
        width: 100%;
        padding: 6px;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid #d0d7de;
        cursor: pointer;
        background: #fff;
      }
      #toggleSite.allow { background: #2da44e; color: #fff; border-color: #2da44e; }
      #toggleSite.remove { background: #fff; color: #cf222e; border-color: #cf222e; }
      details summary { cursor: pointer; font-size: 12px; color: #57606a; margin-bottom: 8px; }
      label { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 5px;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        font-size: 12px;
      }
      .row { margin-top: 8px; font-size: 12px; }
      .row label { display: inline; font-weight: normal; }
      footer { padding: 10px 14px; border-top: 1px solid #e1e4e8; }
      #save {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        background: #0969da;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Process Mining Collector</h1>
      <span class="version" id="version"></span>
    </header>
    <main>
      <div class="site-panel">
        <div class="site-url" id="currentSiteUrl">Carregando site atual…</div>
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
        <button id="toggleSite" style="display: none"></button>
      </div>

      <details>
        <summary>Configuração avançada</summary>
        <label>URL da API</label>
        <input id="apiUrl" placeholder="https://seu-worker.cloudflare.com" />
        <label>Chave de API</label>
        <input id="apiKey" type="password" placeholder="Opcional, se configurada no worker" />
        <label>Sites permitidos (um por linha)</label>
        <textarea id="enabledSites" rows="5" placeholder="https://sei.example.com"></textarea>
        <div class="row">
          <label><input id="isEnabled" type="checkbox" checked /> Ativar observação</label>
        </div>
      </details>
    </main>
    <footer>
      <button id="save">Salvar</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>

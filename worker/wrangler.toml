name = "process-mining"
main = "src/index.js"
compatibility_date = "2024-09-01"

[placement]
mode = "smart"

[[r2_buckets]]
binding = "LOGS_BUCKET"
bucket_name = "logs"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[env.preview]
name = "process-mining-worker-preview"

[[env.preview.r2_buckets]]
binding = "LOGS_BUCKET"
bucket_name = "logs-preview"

[[env.preview.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

  [env.preview.ratelimits.simple]
  limit = 60
  period = 60
